<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeRoute — School Route</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; }
        #map { width: 100%; height: 100vh; }
        .sidebar { position: fixed; top: 0; left: 0; width: 360px; height: 100vh; background: #fff; z-index: 1000; box-shadow: 4px 0 20px rgba(0,0,0,0.1); overflow-y: auto; }
        .header-bar { background: linear-gradient(135deg, #6C4CE0, #8B5CF6); color: white; padding: 16px 20px; }
        .nav-links { display: flex; gap: 8px; padding: 8px 16px; flex-wrap: wrap; }
        .nav-link { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; color: #6C4CE0; background: #f0edff; text-decoration: none; }
        .nav-link:hover { background: #6C4CE0; color: white; }
        .search-box { background: #f8f9fa; border-radius: 12px; padding: 16px; margin: 12px 16px; }
        .search-input { width: 100%; padding: 10px 14px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 14px; outline: none; }
        .search-input:focus { border-color: #6C4CE0; }
        .search-btn { width: 100%; padding: 12px; background: #6C4CE0; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .safety-card { margin: 12px 16px; padding: 16px; background: #f0fdf4; border-radius: 12px; border: 2px solid #bbf7d0; }
        .check-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="header-bar">
            <h1 style="font-size:18px;">🛡️ SafeRoute</h1>
            <p style="font-size:11px; opacity:0.8;">School Route Mode 🏫</p>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link">🗺️ Route</a>
            <a href="/heatmap" class="nav-link">🔥 Heatmap</a>
            <a href="/school" class="nav-link" style="background:#6C4CE0;color:white;">🏫 School</a>
            <a href="/admin" class="nav-link">📊 Admin</a>
        </div>
        <div class="search-box">
            <input type="text" class="search-input" id="homeInput" placeholder="🏠 Home location" />
            <input type="text" class="search-input" id="schoolInput" placeholder="🏫 School location" style="margin-top:8px;" />
            <button class="search-btn" onclick="findSchoolRoute()">🎒 Find Safest School Route</button>
        </div>
        <div id="routeInfo" style="display:none;">
            <div class="safety-card">
                <h3 style="font-weight:700; font-size:14px; margin-bottom:8px;">✅ Child Safety Checklist</h3>
                <div class="check-item"><span style="color:#2ED573;">✅</span> Main roads only</div>
                <div class="check-item"><span style="color:#2ED573;">✅</span> Near school zones</div>
                <div class="check-item"><span style="color:#2ED573;">✅</span> Well-lit path</div>
                <div class="check-item"><span style="color:#2ED573;">✅</span> Police station proximity</div>
                <div class="check-item"><span style="color:#FF4757;">❌</span> No liquor establishments</div>
                <div class="check-item"><span style="color:#FF4757;">❌</span> No isolated areas</div>
                <div style="margin-top:12px; padding-top:12px; border-top:1px solid #bbf7d0;">
                    <div style="display:flex; justify-content:space-between;">
                        <span style="font-size:13px;">Child Safety Score</span>
                        <span style="font-weight:700; color:#2ED573; font-size:18px;" id="childScore">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="map"></div>
    <script>
        let map, routeLine, startMarker, endMarker;

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 26.9124, lng: 75.7873 }, zoom: 14,
                mapTypeControl: false, streetViewControl: false,
            });
            new google.maps.places.Autocomplete(document.getElementById('homeInput'), {
                fields: ['geometry', 'name'], componentRestrictions: { country: 'in' },
            });
            new google.maps.places.Autocomplete(document.getElementById('schoolInput'), {
                fields: ['geometry', 'name'], componentRestrictions: { country: 'in' },
            });
        }

        const locs = {
            'muj': [26.9124, 75.7873], 'manipal': [26.9124, 75.7873],
            'dav': [26.9130, 75.7880], 'school': [26.9130, 75.7880],
            'st xavier': [26.9160, 75.7840], 'railway': [26.9154, 75.7903],
            'mi road': [26.9180, 75.7850], 'mansarovar': [26.8900, 75.7700],
            'sms': [26.9180, 75.7880], 'sindhi camp': [26.9200, 75.7850],
        };

        function parseLoc(input) {
            const l = input.toLowerCase().trim();
            if (locs[l]) return locs[l];
            for (const [k, v] of Object.entries(locs)) { if (l.includes(k)) return v; }
            if (l.includes(',')) { const p = l.split(',').map(s => parseFloat(s.trim())); if (p.length === 2 && !isNaN(p[0])) return p; }
            return null;
        }

        function parseLocAuto(inputEl) {
            // Check autocomplete
            const val = inputEl.value.toLowerCase().trim();
            if (locs[val]) return locs[val];
            for (const [k, v] of Object.entries(locs)) { if (val.includes(k)) return v; }
            if (val.includes(',')) { const p = val.split(',').map(s => parseFloat(s.trim())); if (p.length === 2 && !isNaN(p[0])) return p; }
            return null;
        }

        function findSchoolRoute() {
            const home = parseLocAuto(document.getElementById('homeInput'));
            const school = parseLocAuto(document.getElementById('schoolInput'));
            if (!home || !school) { alert('Enter valid locations. Try: MUJ, DAV, Railway Station'); return; }

            fetch('/api/route', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ start: home, end: school, night: false, mode: 'school', hour: 8 }),
            }).then(r => r.json()).then(data => {
                if (data.error) { alert(data.error); return; }
                const safest = data.routes.find(r => r.type === 'safest') || data.routes[0];
                const path = safest.coordinates.map(c => ({ lat: c[0], lng: c[1] }));

                if (routeLine) routeLine.setMap(null);
                if (startMarker) startMarker.setMap(null);
                if (endMarker) endMarker.setMap(null);

                routeLine = new google.maps.Polyline({
                    path, strokeColor: '#2ED573', strokeWeight: 6, strokeOpacity: 0.9, map,
                });

                startMarker = new google.maps.Marker({
                    position: path[0], map,
                    label: { text: '🏠', fontSize: '16px' },
                    icon: { path: google.maps.SymbolPath.CIRCLE, scale: 14, fillColor: '#6C4CE0', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 },
                });
                endMarker = new google.maps.Marker({
                    position: path[path.length - 1], map,
                    label: { text: '🏫', fontSize: '16px' },
                    icon: { path: google.maps.SymbolPath.CIRCLE, scale: 14, fillColor: '#2ED573', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 },
                });

                const bounds = new google.maps.LatLngBounds();
                path.forEach(p => bounds.extend(p));
                map.fitBounds(bounds, 50);

                document.getElementById('routeInfo').style.display = 'block';
                document.getElementById('childScore').textContent = safest.safety_score + '/100';
            });
        }
    </script>
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD7GKGMDe72vWEitMpeq02ePFs3XvSHI8U&libraries=places&callback=initMap">
    </script>
</body>
</html>
