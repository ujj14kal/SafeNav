<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeRoute — Safety Heatmap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; }
        #map { width: 100%; height: 100vh; }
        .sidebar {
            position: fixed; top: 0; left: 0; width: 360px; height: 100vh;
            background: #fff; z-index: 1000; box-shadow: 4px 0 20px rgba(0,0,0,0.1);
            overflow-y: auto;
        }
        .header-bar { background: linear-gradient(135deg, #6C4CE0, #8B5CF6); color: white; padding: 16px 20px; }
        .nav-links { display: flex; gap: 8px; padding: 8px 16px; flex-wrap: wrap; }
        .nav-link {
            padding: 6px 12px; border-radius: 6px; font-size: 12px;
            font-weight: 600; color: #6C4CE0; background: #f0edff; text-decoration: none;
        }
        .nav-link:hover { background: #6C4CE0; color: white; }
        .time-slider { width: 90%; margin: 16px auto; display: block; }
        .legend { padding: 12px 16px; }
        .legend-bar {
            height: 16px; border-radius: 8px;
            background: linear-gradient(to right, #FF4757, #FFA502, #2ED573); margin: 8px 0;
        }
        .danger-item {
            padding: 10px 16px; border-bottom: 1px solid #f3f4f6;
            display: flex; justify-content: space-between; align-items: center;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="header-bar">
            <h1 style="font-size:18px;">🛡️ SafeRoute</h1>
            <p style="font-size:11px; opacity:0.8;">Safety Heatmap</p>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link">🗺️ Route</a>
            <a href="/heatmap" class="nav-link" style="background:#6C4CE0;color:white;">🔥 Heatmap</a>
            <a href="/school" class="nav-link">🏫 School</a>
            <a href="/admin" class="nav-link">📊 Admin</a>
        </div>
        <div style="padding: 16px;">
            <label style="font-size:13px; font-weight:700;">⏰ Time of Day</label>
            <input type="range" class="time-slider" id="timeSlider" min="0" max="23" value="12" />
            <div style="display:flex; justify-content:space-between; font-size:11px; color:#6b7280;">
                <span>12 AM</span>
                <span id="timeDisplay" style="font-weight:700; color:#6C4CE0;">12:00 PM</span>
                <span>11 PM</span>
            </div>
        </div>
        <div class="legend">
            <h3 style="font-size:13px; font-weight:700; margin-bottom:4px;">Safety Legend</h3>
            <div class="legend-bar"></div>
            <div style="display:flex; justify-content:space-between; font-size:11px;">
                <span style="color:#FF4757;">● 0-30 Dangerous</span>
                <span style="color:#FFA502;">● 31-60 Moderate</span>
                <span style="color:#2ED573;">● 61-100 Safe</span>
            </div>
        </div>
        <h3 style="padding: 8px 16px 4px; font-size:13px; font-weight:700;">🔴 Most Dangerous Zones</h3>
        <div id="dangerZones"></div>
    </div>
    <div id="map"></div>

    <script>
        let map, heatmapDataLayer;

        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 26.9124, lng: 75.7873 },
                zoom: 14,
                mapTypeControl: false,
                streetViewControl: false,
            });
            heatmapDataLayer = new google.maps.Data({ map: map });
            loadHeatmap(12);
        }

        function getHeatmapColor(score) {
            if (score < 20) return '#FF4757';
            if (score < 30) return '#FF6B6B';
            if (score < 40) return '#FF8E53';
            if (score < 50) return '#FFA502';
            if (score < 60) return '#E8D44D';
            if (score < 70) return '#7BED9F';
            if (score < 80) return '#2ED573';
            return '#26de81';
        }

        function loadHeatmap(hour) {
            fetch(`/api/heatmap?hour=${hour}`)
                .then(r => r.json())
                .then(data => {
                    heatmapDataLayer.forEach(f => heatmapDataLayer.remove(f));
                    heatmapDataLayer.addGeoJson(data);
                    heatmapDataLayer.setStyle(feature => ({
                        strokeColor: getHeatmapColor(feature.getProperty('safety_score')),
                        strokeWeight: 4,
                        strokeOpacity: 0.7,
                    }));
                    heatmapDataLayer.addListener('click', e => {
                        const score = e.feature.getProperty('safety_score');
                        const roadType = e.feature.getProperty('road_type');
                        const lit = e.feature.getProperty('lit');
                        new google.maps.InfoWindow({
                            content: `<b>Safety: ${score}/100</b><br>Road: ${roadType}<br>Lit: ${lit ? 'Yes ✅' : 'No ❌'}`,
                            position: e.latLng,
                        }).open(map);
                    });
                });

            fetch(`/api/admin/stats?hour=${hour}`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('dangerZones').innerHTML = (data.danger_zones || []).slice(0, 10).map(z => {
                        const color = z.score < 20 ? '#FF4757' : z.score < 30 ? '#FFA502' : '#E8D44D';
                        return `<div class="danger-item">
                            <div>
                                <div style="font-size:13px; font-weight:600;">${z.name}</div>
                                <div style="font-size:11px; color:#6b7280;">${z.road_type} road</div>
                            </div>
                            <span style="font-weight:700; background:${color}20; color:${color}; padding:4px 10px; border-radius:6px;">${z.score}</span>
                        </div>`;
                    }).join('');
                });
        }

        document.getElementById('timeSlider').addEventListener('input', (e) => {
            const hour = parseInt(e.target.value);
            const ampm = hour >= 12 ? 'PM' : 'AM';
            const h12 = hour === 0 ? 12 : hour > 12 ? hour - 12 : hour;
            document.getElementById('timeDisplay').textContent = `${h12}:00 ${ampm}`;
            loadHeatmap(hour);
        });
    </script>
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD7GKGMDe72vWEitMpeq02ePFs3XvSHI8U&callback=initMap">
    </script>
</body>
</html>
